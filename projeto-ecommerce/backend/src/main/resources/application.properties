server.port=8080
spring.application.name=ecommerce-backend

# Ligacao ao SQL Server (variaveis de ambiente, com valores por defeito).
# Usa o nome da instancia (SQLEXPRESS): o driver descobre a porta atraves do servico SQL Server Browser,
# por isso nao depende de uma porta fixa. Exige o servico "SQL Server Browser" a correr e o TCP/IP ativo.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=EcommerceDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:ecommerce_app}
spring.datasource.password=${DB_PASS:basedados2026}

# Dinheiro como numero no JSON
spring.jackson.serialization.write-bigdecimal-as-plain=true

# Falha depressa se nao houver ligacao a BD (por defeito esperava 30 s)
spring.datasource.hikari.connection-timeout=5000
